# HumanEval-X C++ pilot (Table 7): example_test guides the search; 3 iterations x branch 3, C++17 executor.
search:
  max_iterations: 3
  branch_factor: 3
  max_depth: 4
  exploration_c: 1.4
  path_memory_k: 3
  global_memory_top_t: 2
  success_threshold: 0.999
  no_improve_patience: 3

reward:
  w_unit: 0.8
  w_exec: 0.2
  w_semantic: 0.0
  semantic_mode: disabled
  semantic_on_success: false
  semantic_on_failure: false
  semantic_max_feedback_chars: 3000

reflection:
  mode: llm
  max_feedback_chars: 3000
  fallback_on_error: true

production:
  complete_branch_before_accept: true
  min_accept_iterations: 2

semantic:
  alpha: 0.4
  beta: 0.6

sandbox:
  timeout_sec: 8
  max_output_chars: 4000

llm:
  model_name: qwen3-8b
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: REMCTS_API_KEY
  timeout_sec: 90
  max_retries: 5
  enable_thinking: false
  temperature: 0.2
  max_tokens: 2048

storage:
  run_output_dir: outputs/runs-cpp
