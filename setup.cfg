[metadata]
name = remcts
version = 0.1.0
description = Reflection-enhanced Monte Carlo Tree Search for code generation
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = ReMCTS Authors
author_email = yifanyuan@szu.edu.cn

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.26
    PyYAML>=6.0
    jsonlines>=4.0
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
remcts =
    config/*.yaml
    llm/templates/*.md

[options.exclude_package_data]
remcts =
    config/ballbox.yaml

[options.entry_points]
console_scripts =
    remcts-run-search = remcts.cli.run_search:main
    remcts-evaluate = remcts.cli.evaluate:main
    remcts-inspect-run = remcts.cli.inspect_run:main

[options.extras_require]
dev =
    pytest>=8.0
